# PostgreSQL Configuration for AICO
# Optimized for self-hosted deployment with SSD storage
# Based on PostgreSQL 18.1 best practices

# =============================================================================
# CONNECTIONS AND AUTHENTICATION
# =============================================================================

# Network Settings
listen_addresses = '*'                  # Listen on all interfaces (Docker networking)
port = 5432                             # PostgreSQL port

max_connections = 100                   # Maximum concurrent connections
superuser_reserved_connections = 3      # Reserved for superuser

# =============================================================================
# RESOURCE USAGE (MEMORY)
# =============================================================================

# Shared Memory Settings
shared_buffers = 1GB                    # 25% of system RAM (for 4GB system)
                                        # Adjust based on available RAM:
                                        # - 4GB RAM: 1GB
                                        # - 8GB RAM: 2GB
                                        # - 16GB RAM: 4GB

effective_cache_size = 4GB              # OS + Postgres cache (75% of RAM)
                                        # Helps query planner make decisions

# Per-Operation Memory
work_mem = 16MB                         # Memory per query operation (sort, hash)
                                        # Total can be: work_mem * max_connections
                                        # 16MB * 100 = 1.6GB max

maintenance_work_mem = 256MB            # Memory for VACUUM, CREATE INDEX, etc.

# =============================================================================
# WRITE AHEAD LOG (WAL)
# =============================================================================

wal_buffers = 16MB                      # WAL buffer size (auto-tuned if -1)
min_wal_size = 1GB                      # Minimum WAL size before recycling
max_wal_size = 4GB                      # Maximum WAL size before checkpoint

checkpoint_completion_target = 0.9      # Spread checkpoints over 90% of interval
checkpoint_timeout = 10min              # Maximum time between checkpoints

# =============================================================================
# QUERY TUNING
# =============================================================================

# Cost-Based Optimizer Settings (SSD-optimized)
random_page_cost = 1.1                  # SSD: 1.1, HDD: 4.0
                                        # Lower = optimizer prefers random access

effective_io_concurrency = 200          # SSD concurrent I/O operations
                                        # SSD: 200, HDD: 2

# Parallel Query Execution
max_parallel_workers_per_gather = 4     # Parallel workers per query
max_parallel_workers = 8                # Total parallel workers
max_worker_processes = 8                # Background worker processes

# =============================================================================
# PERFORMANCE OPTIMIZATIONS
# =============================================================================

# JIT Compilation (PostgreSQL 11+)
jit = on                                # Enable JIT compilation
jit_above_cost = 100000                 # JIT for queries with cost > 100k
jit_inline_above_cost = 500000          # Inline functions for expensive queries
jit_optimize_above_cost = 500000        # Optimize JIT for expensive queries

# Planner Settings
default_statistics_target = 100         # Statistics detail level (10-10000)

# =============================================================================
# LOGGING
# =============================================================================

# What to Log
log_destination = 'stderr'              # Log to stderr (Docker captures this)
logging_collector = off                 # Docker handles log collection

# When to Log
log_min_duration_statement = 1000       # Log queries taking > 1 second
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# What Queries to Log
log_statement = 'none'                  # Don't log all statements (too verbose)
log_duration = off                      # Don't log all durations
log_checkpoints = on                    # Log checkpoint activity
log_connections = on                    # Log connections
log_disconnections = on                 # Log disconnections
log_lock_waits = on                     # Log lock waits (deadlock detection)

# =============================================================================
# AUTOVACUUM
# =============================================================================

autovacuum = on                         # Enable autovacuum
autovacuum_max_workers = 3              # Concurrent autovacuum workers
autovacuum_naptime = 1min               # Time between autovacuum runs

# Autovacuum Thresholds
autovacuum_vacuum_threshold = 50        # Minimum rows before VACUUM
autovacuum_analyze_threshold = 50       # Minimum rows before ANALYZE
autovacuum_vacuum_scale_factor = 0.2    # Fraction of table size for VACUUM
autovacuum_analyze_scale_factor = 0.1   # Fraction of table size for ANALYZE

# =============================================================================
# CLIENT CONNECTION DEFAULTS
# =============================================================================

# Locale and Formatting
datestyle = 'iso, mdy'
timezone = 'UTC'                        # All timestamps in UTC
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# Default Text Search Configuration
default_text_search_config = 'pg_catalog.english'

# =============================================================================
# LOCK MANAGEMENT
# =============================================================================

deadlock_timeout = 1s                   # Time before checking for deadlock
max_locks_per_transaction = 64          # Locks per transaction

# =============================================================================
# AICO-SPECIFIC OPTIMIZATIONS
# =============================================================================

# Schema Search Path
# Note: This is set per-connection in application code
# search_path = 'aico_core, public'

# Statement Timeout (safety net)
statement_timeout = 60000               # 60 seconds max per statement

# Idle Transaction Timeout
idle_in_transaction_session_timeout = 300000  # 5 minutes

# =============================================================================
# NOTES
# =============================================================================

# Memory Sizing Guidelines:
# - shared_buffers: 25% of RAM
# - effective_cache_size: 75% of RAM
# - work_mem: (RAM - shared_buffers) / (max_connections * 3)
#
# For 4GB RAM system:
# - shared_buffers = 1GB
# - effective_cache_size = 3GB
# - work_mem = 16MB
#
# For 8GB RAM system:
# - shared_buffers = 2GB
# - effective_cache_size = 6GB
# - work_mem = 32MB
#
# Adjust based on your hardware!

# Performance Monitoring:
# - Monitor with: SELECT * FROM pg_stat_database;
# - Check slow queries: SELECT * FROM pg_stat_statements;
# - Monitor connections: SELECT * FROM pg_stat_activity;
