auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

# Retention configuration - keep logs for 30 days
limits_config:
  retention_period: 720h  # 30 days
  max_query_length: 721h
  max_query_lookback: 720h
  # Drastically increase query limits for Grafana dashboards
  max_concurrent_tail_requests: 500
  max_query_parallelism: 256
  max_streams_per_user: 50000
  max_entries_limit_per_query: 50000
  split_queries_by_interval: 15m
  # Increase ingester query limits
  per_stream_rate_limit: 100MB
  per_stream_rate_limit_burst: 200MB
  # Increase query timeout and concurrency
  query_timeout: 10m
  max_outstanding_per_tenant: 8192
  # Additional query optimization
  max_cache_freshness_per_query: 10m
  max_query_series: 10000

# Compactor for retention enforcement
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
