auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Disable server-level rate limiting
  grpc_server_max_concurrent_streams: 10000
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600
  http_server_read_timeout: 30m
  http_server_write_timeout: 30m
  http_server_idle_timeout: 30m

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

frontend:
  max_outstanding_per_tenant: 32768
  compress_responses: true

querier:
  max_concurrent: 64

query_scheduler:
  max_outstanding_requests_per_tenant: 200000

query_range:
  parallelise_shardable_queries: true

ruler:
  alertmanager_url: http://localhost:9093

# Retention configuration - keep logs for 30 days
limits_config:
  retention_period: 720h  # 30 days
  max_query_length: 721h
  # Massively increase ALL query limits for development
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  max_concurrent_tail_requests: 1000
  max_query_parallelism: 512
  max_streams_per_user: 100000
  max_entries_limit_per_query: 100000
  max_global_streams_per_user: 100000
  split_queries_by_interval: 24h
  # Increase ingester query limits
  per_stream_rate_limit: 500MB
  per_stream_rate_limit_burst: 1GB
  ingestion_rate_mb: 100
  ingestion_burst_size_mb: 200
  # Increase query timeout and concurrency
  query_timeout: 30m
  max_query_lookback: 0
  # Disable all query limits for development
  cardinality_limit: 1000000
  max_streams_matchers_per_query: 10000
  max_chunks_per_query: 100000000

# Compactor for retention enforcement
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
