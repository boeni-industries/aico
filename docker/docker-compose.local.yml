# AICO Local Development Infrastructure
# All containers are labeled with project ownership and metadata
name: aico

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: aico-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    ports:
      - "9000:9000" # S3 API (optional to expose; used by host tools)
      - "9001:9001" # Console UI (optional)
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - aico-miniodata:/data
    networks:
      default:
        aliases:
          - minio
          - aico-minio
    labels:
      com.aico.project: "aico"
      com.aico.component: "minio"
      com.aico.service.type: "storage"
      com.aico.service.role: "artifact-store"
      org.opencontainers.image.title: "AICO MinIO"
      org.opencontainers.image.description: "S3-compatible artifact store for backups and exports"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: aico-minio-init
    restart: "no"
    depends_on:
      - minio
    secrets:
      - minio_root_user
      - minio_root_password
      - artifact_store_access_key
      - artifact_store_secret_key
    entrypoint:
      - sh
      - -lc
      - |
        set -e
        ROOT_USER="$(cat /run/secrets/minio_root_user | tr -d '\012')"
        ROOT_PASS="$(cat /run/secrets/minio_root_password | tr -d '\012')"
        APP_ACCESS="$(cat /run/secrets/artifact_store_access_key | tr -d '\012')"
        APP_SECRET="$(cat /run/secrets/artifact_store_secret_key | tr -d '\012')"
        for i in $(seq 1 30); do
          if mc alias set aico http://minio:9000 "$$ROOT_USER" "$$ROOT_PASS" >/dev/null 2>&1; then
            break
          fi
          echo "Waiting for MinIO... ($$i/30)"
          sleep 1
        done
        mc alias set aico http://minio:9000 "$$ROOT_USER" "$$ROOT_PASS"
        mc mb --ignore-existing aico/aico-artifacts
        mc admin user add aico "$$APP_ACCESS" "$$APP_SECRET" || true
        mc admin policy attach aico readwrite --user "$$APP_ACCESS" || true
        echo "MinIO initialized"
    labels:
      com.aico.project: "aico"
      com.aico.component: "minio-init"
      com.aico.service.type: "bootstrap"
      com.aico.service.role: "artifact-store-init"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  nats:
    image: nats:2.10
    container_name: aico-nats
    restart: unless-stopped
    command:
      - "-js"
      - "-m"
      - "8222"
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
    volumes:
      - aico-natsdata:/data
    labels:
      com.aico.project: "aico"
      com.aico.component: "nats"
      com.aico.service.type: "message-bus"
      com.aico.service.role: "nats-jetstream"
      org.opencontainers.image.title: "AICO NATS"
      org.opencontainers.image.description: "NATS + JetStream message bus for AICO"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  valkey:
    image: valkey/valkey:8.0.1
    container_name: aico-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - aico-valkeydata:/data
    labels:
      com.aico.project: "aico"
      com.aico.component: "valkey"
      com.aico.service.type: "cache"
      com.aico.service.role: "rate-limiting-store"
      org.opencontainers.image.title: "AICO Valkey"
      org.opencontainers.image.description: "Valkey (Redis-compatible) store for gateway rate limiting"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gateway
    container_name: aico-gateway
    restart: unless-stopped
    environment:
      AICO_ENV: development
      AICO_CONFIG_DIR: /app/config
      AICO_DATA_DIR: /var/lib/aico
      AICO_CACHE_DIR: /var/cache/aico
      AICO_RUNTIME_DIR: /run/aico
      AICO_NATS_URL: nats://nats:4222
      AICO_NATS_HOST: nats
      AICO_NATS_PORT: "4222"
      AICO_PG_HOST: postgres
      AICO_INSTRUMENTATION_ENABLED: "true"
      AICO_INSTRUMENTATION_MODE: "prod"
      AICO_LOKI_URL: http://loki:3100
      AICO_REST_HOST: 0.0.0.0
      AICO_TRANSPORT_ENCRYPTION_ENABLED: "true"
      AICO_GATEWAY_ENCRYPTION_PLUGIN_ENABLED: "true"
      AICO_GATEWAY_SECURITY_PLUGIN_ENABLED: "true"
    secrets:
      - api_gateway_jwt_secret
      - pg_password
    volumes:
      - aico-gateway-state:/var/lib/aico
      - aico-gateway-cache:/var/cache/aico
    tmpfs:
      - /run/aico
    ports:
      - "8771:8771"
    depends_on:
      - nats
      - core
    labels:
      com.aico.project: "aico"
      com.aico.component: "gateway"
      com.aico.service.type: "application"
      com.aico.service.role: "http-edge"
      org.opencontainers.image.title: "AICO Gateway"
      org.opencontainers.image.description: "AICO API Gateway (HTTP edge)"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    container_name: aico-core
    restart: unless-stopped
    environment:
      AICO_ENV: development
      AICO_CONFIG_DIR: /app/config
      AICO_DATA_DIR: /var/lib/aico
      AICO_CACHE_DIR: /var/cache/aico
      AICO_RUNTIME_DIR: /run/aico
      AICO_ARTIFACT_STORE_ENDPOINT: http://minio:9000
      AICO_ARTIFACT_STORE_BUCKET: aico-artifacts
      AICO_NATS_URL: nats://nats:4222
      AICO_VALKEY_URL: redis://valkey:6379/0
      AICO_INSTRUMENTATION_ENABLED: "true"
      AICO_INSTRUMENTATION_MODE: "prod"
      AICO_LOKI_URL: http://loki:3100
      AICO_PG_HOST: postgres
    secrets:
      - pg_password
      - artifact_store_access_key
      - artifact_store_secret_key
    volumes:
      - aico-core-state:/var/lib/aico
      - aico-core-cache:/var/cache/aico
      - /var/run/docker.sock:/var/run/docker.sock
    tmpfs:
      - /run/aico
    depends_on:
      - postgres
      - nats
      - valkey
      - minio
    labels:
      com.aico.project: "aico"
      com.aico.component: "core"
      com.aico.service.type: "application"
      com.aico.service.role: "domain-services"
      org.opencontainers.image.title: "AICO Core"
      org.opencontainers.image.description: "AICO core services (no public HTTP)"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  modelservice:
    build:
      context: ..
      dockerfile: docker/Dockerfile.modelservice
    container_name: aico-modelservice
    restart: unless-stopped
    environment:
      AICO_ENV: development
      AICO_CONFIG_DIR: /app/config
      AICO_DATA_DIR: /var/lib/aico
      AICO_CACHE_DIR: /var/cache/aico
      AICO_RUNTIME_DIR: /run/aico
      AICO_NATS_URL: nats://nats:4222
      AICO_LOKI_URL: http://loki:3100
      AICO_REST_HOST: gateway
      HF_HOME: /var/cache/aico/huggingface
      TRANSFORMERS_CACHE: /var/cache/aico/huggingface
    secrets:
      - pg_password
    volumes:
      - aico-modelservice-state:/var/lib/aico
      - aico-modelservice-cache:/var/cache/aico
    tmpfs:
      - /run/aico
    depends_on:
      - gateway
      - core
    labels:
      com.aico.project: "aico"
      com.aico.component: "modelservice"
      com.aico.service.type: "application"
      com.aico.service.role: "model-inference"
      org.opencontainers.image.title: "AICO Modelservice"
      org.opencontainers.image.description: "AICO modelservice container"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  postgres:
    image: pgvector/pgvector:0.8.1-pg18
    container_name: aico-postgres
    restart: unless-stopped
    environment:
      # Non-secret parameters; safe to keep here
      POSTGRES_DB: aico
      POSTGRES_USER: postgres
      # Postgres official image supports *_FILE
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    ports:
      # Expose to host so aico CLI / psql can connect (matches core.yaml defaults)
      - "5432:5432"
    volumes:
      # Postgres 18+ requires mount at /var/lib/postgresql (not /data subdirectory)
      # This supports pg_ctlcluster format and proper version-specific directories
      - aico-pgdata:/var/lib/postgresql
      # Mount production-grade postgresql.conf for optimal performance
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      # Mount pg_hba.conf for password authentication
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      # Use custom configuration files
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    labels:
      # Project identification
      com.aico.project: "aico"
      com.aico.component: "postgres"
      com.aico.service.type: "database"
      com.aico.service.role: "primary-datastore"
      # Standard Docker labels
      org.opencontainers.image.title: "AICO Postgres Database"
      org.opencontainers.image.description: "Primary relational database for AICO system"
      org.opencontainers.image.vendor: "AICO"
      # Management metadata
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  postgres-shadow:
    image: pgvector/pgvector:0.8.1-pg18
    container_name: aico-postgres-shadow
    restart: unless-stopped
    environment:
      POSTGRES_DB: aico
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    secrets:
      - pg_password
    ports:
      # Shadow instance exposed on a different port to avoid clashes
      - "55432:5432"
    volumes:
      - aico-pgdata-shadow:/var/lib/postgresql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    labels:
      com.aico.project: "aico"
      com.aico.component: "postgres-shadow"
      com.aico.service.type: "database"
      com.aico.service.role: "shadow-datastore"
      org.opencontainers.image.title: "AICO Postgres Shadow Database"
      org.opencontainers.image.description: "Shadow relational database for AICO schema testing"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev-shadow"

  loki:
    image: grafana/loki:3.6.7
    container_name: aico-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - aico-lokidata:/loki
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    labels:
      # Project identification
      com.aico.project: "aico"
      com.aico.component: "loki"
      com.aico.service.type: "logging"
      com.aico.service.role: "log-aggregation"
      # Standard Docker labels
      org.opencontainers.image.title: "AICO Loki"
      org.opencontainers.image.description: "Log aggregation system for AICO"
      org.opencontainers.image.vendor: "AICO"
      # Management metadata
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.146.1
    container_name: aico-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # Collector internal telemetry metrics
      - "8889:8889" # Prometheus exporter (spanmetrics)
    depends_on:
      - tempo
    labels:
      com.aico.project: "aico"
      com.aico.component: "otel-collector"
      com.aico.service.type: "observability"
      com.aico.service.role: "telemetry-router"
      org.opencontainers.image.title: "AICO OpenTelemetry Collector"
      org.opencontainers.image.description: "OTLP ingest + tail sampling + spanmetrics"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  tempo:
    image: grafana/tempo:2.10.1
    container_name: aico-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
      - "3200:3200" # Tempo HTTP API
      - "4319:4317" # Optional direct OTLP gRPC (collector uses internal tempo:4317)
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - aico-tempodata:/var/tempo
    labels:
      com.aico.project: "aico"
      com.aico.component: "tempo"
      com.aico.service.type: "observability"
      com.aico.service.role: "tracing"
      org.opencontainers.image.title: "AICO Tempo"
      org.opencontainers.image.description: "Distributed tracing backend"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  prometheus:
    image: prom/prometheus:v3.10.0
    container_name: aico-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - aico-prometheusdata:/prometheus
    depends_on:
      - otel-collector
    labels:
      com.aico.project: "aico"
      com.aico.component: "prometheus"
      com.aico.service.type: "observability"
      com.aico.service.role: "metrics"
      org.opencontainers.image.title: "AICO Prometheus"
      org.opencontainers.image.description: "Metrics backend for spanmetrics and dashboards"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  grafana:
    image: grafana/grafana:12.4.0
    container_name: aico-grafana
    restart: unless-stopped
    environment:
      # Admin credentials provided via environment
      GF_SECURITY_ADMIN_USER: ${AICO_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${AICO_GRAFANA_PASSWORD:-}
      # Disable analytics and update checks
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Server settings
      GF_SERVER_ROOT_URL: "http://localhost:3001"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      # Default dashboard settings
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/etc/grafana/provisioning/dashboards/aico-logs-overview.json"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_HOME_PAGE: "/d/aico-logs-overview"
    ports:
      - "3001:3000"
    volumes:
      - aico-grafanadata:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki
      - tempo
      - prometheus
    labels:
      com.aico.project: "aico"
      com.aico.component: "grafana"
      com.aico.service.type: "visualization"
      com.aico.service.role: "log-visualization"
      org.opencontainers.image.title: "AICO Grafana"
      org.opencontainers.image.description: "Log visualization and dashboards for AICO"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

  studio:
    build:
      context: ../../aico-studio
      dockerfile: docker/Dockerfile.prod
    container_name: aico-studio
    restart: unless-stopped
    environment:
      AICO_STUDIO_API_BASE_URL: /api/v1
    ports:
      - "3002:80"
    depends_on:
      - gateway
    labels:
      com.aico.project: "aico"
      com.aico.component: "studio"
      com.aico.service.type: "application"
      com.aico.service.role: "ui"
      org.opencontainers.image.title: "AICO Studio"
      org.opencontainers.image.description: "AICO Studio web UI"
      org.opencontainers.image.vendor: "AICO"
      com.aico.managed-by: "aico-cli"
      com.aico.deployment.type: "local-dev"

volumes:
  aico-miniodata:
    external: true
    name: aico-miniodata

  aico-natsdata:
    external: true
    name: aico-natsdata

  aico-valkeydata:
    name: aico-valkeydata
  aico-lokidata:
    external: true
    name: aico-lokidata
  aico-grafanadata:
    external: true
    name: aico-grafanadata

  aico-tempodata:
    name: aico-tempodata

  aico-prometheusdata:
    name: aico-prometheusdata

  aico-gateway-state:
    external: true
    name: aico-gateway-state
  aico-gateway-cache:
    external: true
    name: aico-gateway-cache
  aico-core-state:
    external: true
    name: aico-core-state
  aico-core-cache:
    external: true
    name: aico-core-cache
  aico-modelservice-state:
    external: true
    name: aico-modelservice-state
  aico-modelservice-cache:
    external: true
    name: aico-modelservice-cache

  aico-pgdata:
    external: true
    name: aico-pgdata
  
  aico-pgdata-shadow:
    external: true
    name: aico-pgdata-shadow

secrets:
  pg_password:
    file: ./secrets/pg_password
  api_gateway_jwt_secret:
    file: ./secrets/api_gateway_jwt_secret
  minio_root_user:
    file: ./secrets/minio_root_user
  minio_root_password:
    file: ./secrets/minio_root_password
  artifact_store_access_key:
    file: ./secrets/artifact_store_access_key
  artifact_store_secret_key:
    file: ./secrets/artifact_store_secret_key
