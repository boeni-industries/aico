[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aico-shared"
version = "1.0.0"
description = "AICO shared library"
requires-python = ">=3.13"
dependencies = [
    "cryptography",
    "email-validator>=2.0.0",
    "keyring",
    "pyyaml",
    "jsonschema",
    "watchdog",
    "nats-py>=2.9.0",
    "protobuf>=6.32.0,<7.0.0",
    "grpcio-tools>=1.62.0",
    "platformdirs>=4.0.0",
    "psutil>=6.1.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.1",
    "pynacl>=1.5.0",
    "lmdb>=1.7.3",
    "chromadb>=1.0.16",
    "duckdb>=1.3.2",
    "hnswlib",
    "grand-cypher",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "requests>=2.31.0,<3.0.0",
    "pyjwt>=2.10.1",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "influxdb-client>=1.45.0",
]

[tool.setuptools]
packages = ["aico"]

[tool.setuptools.package-dir]
aico = "aico"
