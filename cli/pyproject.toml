[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aico-cli"
version = "1.0.0"
description = "AICO CLI"
requires-python = ">=3.13"
dependencies = [
    "aico-shared",
    "typer>=0.12.3,<1.0.0",
    "rich>=13.7.0,<14.0.0",
]

[tool.uv.sources]
aico-shared = { path = "../shared", editable = true }

[project.scripts]
aico = "cli.aico_main:app"

[tool.setuptools]
packages = ["cli"]

[tool.setuptools.package-dir]
cli = "."
