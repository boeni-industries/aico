[pytest]
pythonpath = .
testpaths = shared/tests backend/tests modelservice/tests

# Async test configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Output configuration
addopts = 
    -v
    --strict-markers
    --tb=short

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (cross-component)
    system: System tests (end-to-end)
    slow: Slow tests (>1s)
    agency: Agency system tests
    memory: Memory system tests
    scheduler: Scheduler tests
    conversation: Conversation engine tests

# Coverage configuration
[coverage:run]
source = shared,backend,modelservice
omit = 
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */.venv/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
