# Service Authentication Configuration
defaults:
  token_validity_hours: 8760  # 1 year
  issuer: "aico-system"
  require_component_identity: true
  validate_audience: true
  validate_expiry: true

services:
  modelservice:
    enabled: true
    permissions:
      - "logs:write"
      - "health:read"
  frontend:
    enabled: true
    permissions:
      - "logs:write"
      - "conversation:read"
      - "conversation:write"
  cli:
    enabled: true
    permissions:
      - "admin:read"
      - "admin:write"
      - "logs:read"
      - "system:read"
  studio:
    enabled: true
    permissions:
      - "logs:write"
      - "system:read"
      - "admin:read"