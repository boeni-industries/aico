# PostgreSQL configuration
# Password / credentials are derived and stored via AICOKeyManager,
# not kept in this config file.

# Logical database name and schemas inside a single Postgres cluster
db_name: "aico"
core_schema: "aico_core"

# Connection settings for local/remote Postgres
host: "127.0.0.1"
port: 5432
user: "postgres"
sslmode: "prefer"

# Connection pool settings
pool_size: 20              # Number of persistent connections
max_overflow: 10           # Additional connections when pool exhausted
pool_timeout: 30           # Seconds to wait for available connection
pool_recycle: 3600         # Recycle connections after N seconds (1 hour)
pool_pre_ping: true        # Verify connections before use (health check)
