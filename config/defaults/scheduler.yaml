# Task Scheduler Configuration
# Manages background task execution with resource awareness

enabled: true
max_concurrent_tasks: 10
max_cpu_percent: 80
max_memory_percent: 80
scheduler_interval: 1.0  # seconds
task_timeout: 3600  # 1 hour
idle_threshold_cpu: 20      # percent
idle_threshold_memory: 70   # percent

distributed:
  enabled: false
  stream_name: "SCHEDULER_JOBS"
  subject_filter: "scheduler.jobs.*"
  publish_subject: "scheduler.jobs.run"

deterministic:
  enabled: true
  reconcile_interval_seconds: 30
  lookahead_seconds: 21600  # 6 hours
  backfill_seconds: 7200     # 2 hours
  missed_grace_seconds: 600  # 10 minutes
  retention_days: 30         # Keep run ledger history for 30 days
