# User profile configuration
user_profiles:
  default_user_type: "person"

# Core Services Configuration
services:
  # Message bus service configuration
  message_bus:
    enabled: true
    nats_url: "nats://localhost:4222"
    timeout: 120.0
  
  # Task scheduler service configuration  
  task_scheduler:
    enabled: true
    max_concurrent_tasks: 10
    scheduler_interval: 1.0
    
  # Log consumer service removed - logs now go directly to InfluxDB via handler
    
  # Security service configuration
  security:
    enabled: true
    encryption: true
    
  # Emotion engine service configuration
  emotion_engine:
    enabled: true
  
  # Conversation engine service configuration
  conversation_engine:
    enabled: true
    memory_integration: true
    emotion_integration: true
    
  # Validation service configuration
  validation:
    enabled: true
    strict_mode: false
    
  # Encryption service configuration
  encryption:
    enabled: true
    algorithm: "AES-256-GCM"
  
# AI Processing Configuration
