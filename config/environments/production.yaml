system:
  environment: "production"
  log_level: "INFO"  # Production environment overrides

api_gateway:
  protocols:
    rest:
      cors:
        origins:
          - "https://aico.app"    # Studio admin UI (production)
          - "http://127.0.0.1:3000"    # IP variant for compatibility

security:
  audit:
    log_level: "WARNING"  # Security events and above only
    retention_days: 365

message_bus:
  heartbeat_interval: 60
