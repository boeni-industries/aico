# Development environment overrides
system:
  environment: "development"
  log_level: "DEBUG"

api_gateway:
  protocols:
    rest:
      cors:
        origins:
          - "http://localhost:3000"
          - "http://127.0.0.1:3000"
          - "http://localhost:8771"
          - "http://127.0.0.1:8771"

audit:
  log_level: "DEBUG"  # Detailed audit logging for development
