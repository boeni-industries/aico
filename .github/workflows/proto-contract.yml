name: Protobuf Contract Gate

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  proto-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: latest

      - name: Verify protobuf contract is backwards compatible
        run: buf breaking --against contracts/proto

      - name: Lint protobufs
        run: buf lint
