name: OpenAPI Contract Gate

on:
  pull_request:
  push:

jobs:
  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Verify OpenAPI artifact is up to date
        working-directory: backend
        run: uv run python ../scripts/generate_openapi_public.py --check --output ../contracts/openapi/v1.json

      - name: Verify internal OpenAPI artifact is up to date
        working-directory: backend
        run: uv run python ../scripts/generate_openapi_internal.py --check --output ../contracts/openapi/internal-v1.json
