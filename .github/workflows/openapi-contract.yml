name: OpenAPI Contract Gate

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  openapi-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Sync dependencies
        run: uv sync --extra backend

      - name: Verify OpenAPI artifact is up to date
        run: uv run python scripts/generate_openapi_public.py --check

      - name: Verify internal OpenAPI artifact is up to date
        run: uv run python scripts/generate_openapi_internal.py --check
