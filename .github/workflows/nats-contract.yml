name: NATS Contract Gate

on:
  pull_request:
  push:

jobs:
  nats-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Verify NATS contract artifact is up to date
        working-directory: backend
        run: uv run python ../scripts/generate_nats_contract.py --check --output ../contracts/nats/v1.json
