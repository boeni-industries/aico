name: Contract Update Policy

on:
  pull_request:
  push:

jobs:
  check-contract-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine diff range
        id: diff_range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BEFORE_SHA="${{ github.event.pull_request.base.sha }}"
            AFTER_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BEFORE_SHA="${{ github.event.before }}"
            AFTER_SHA="${{ github.sha }}"
          fi

          if [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BEFORE_SHA="$(git rev-parse "${AFTER_SHA}^" 2>/dev/null || true)"
          fi

          if [ -z "$BEFORE_SHA" ]; then
            echo "Unable to determine a valid base revision for contract diff" >&2
            exit 1
          fi

          echo "before_sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          echo "after_sha=$AFTER_SHA" >> "$GITHUB_OUTPUT"

      - name: Check if contracts changed
        id: contracts_changed
        run: |
          BEFORE_SHA="${{ steps.diff_range.outputs.before_sha }}"
          AFTER_SHA="${{ steps.diff_range.outputs.after_sha }}"

          # Determine which contract files changed, excluding the contract changelog itself and
          # excluding contract tooling/config-only files.
          CHANGED_CONTRACT_FILES=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" \
            | grep '^contracts/' \
            | grep -v '^contracts/CHANGELOG.md$' \
            | grep -v '^contracts/.*/buf\.ya?ml$' \
            || true)

          if [ -n "$CHANGED_CONTRACT_FILES" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_CONTRACT_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if CHANGELOG updated
        if: steps.contracts_changed.outputs.changed == 'true'
        run: |
          BEFORE_SHA="${{ steps.diff_range.outputs.before_sha }}"
          AFTER_SHA="${{ steps.diff_range.outputs.after_sha }}"

          if git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" | grep -q '^contracts/CHANGELOG.md$'; then
            echo "✅ Contract CHANGELOG.md was updated"
            exit 0
          else
            echo "❌ Contract files changed but contracts/CHANGELOG.md was not updated"
            echo ""
            echo "Policy: Any change to /contracts/** requires an entry in contracts/CHANGELOG.md"
            echo ""
            echo "Changed contract files:"
            echo "${{ steps.contracts_changed.outputs.changed_files }}"
            echo ""
            echo "Please add an entry to contracts/CHANGELOG.md explaining:"
            echo "  - What changed (new endpoints, fields, etc.)"
            echo "  - Why (feature, bugfix, etc.)"
            echo "  - Compatibility impact (additive/non-breaking)"
            exit 1
          fi
