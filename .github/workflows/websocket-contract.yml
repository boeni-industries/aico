name: WebSocket Contract Gate

on:
  pull_request:
  push:

jobs:
  websocket-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Sync dependencies
        working-directory: gateway
        run: uv sync --frozen

      - name: Verify WebSocket contract artifact is up to date
        working-directory: gateway
        run: uv run python ../scripts/generate_websocket_contract.py --check --output ../contracts/websocket/v1.json
